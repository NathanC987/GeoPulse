name: geopulse

x-spark: &spark
  image: geopulse-spark:latest
  build:
    context: ./docker/spark
  volumes:
    - ./:/opt/geopulse/app
    - ./data:/opt/geopulse/data
  environment:
    - PYTHONPATH=/opt/geopulse/app

x-app: &app
  image: geopulse-app:latest
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  volumes:
    - ./:/app
    - ./data:/data
  environment:
    - KAFKA_BOOTSTRAP=kafka:9092
    - PG_DSN=postgresql://geopulse:geopulse@postgres:5432/geopulse
    - HIVE_HOST=spark-thrift
    - HIVE_PORT=10000
    - DATA_DIR=/data
    - PYTHONPATH=/app

services:
  # ---------------- Data capture ----------------
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.1
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic checkins --partitions 3 --replication-factor 1
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: geopulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xmx256m
    depends_on:
      kafka: { condition: service_healthy }

  # ---------------- Storage / serving ----------------
  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse
      POSTGRES_DB: geopulse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopulse -d geopulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------- Processing (Spark standalone cluster) ----------------
  spark-master:
    <<: *spark
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports: ["8080:8080", "4040:4040"]
    depends_on:
      postgres: { condition: service_healthy }

  spark-worker-1: &worker
    <<: *spark
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 4 --memory 4g --work-dir /tmp/spark-work spark://spark-master:7077
    depends_on: [spark-master]

  spark-worker-2:
    <<: *worker
    hostname: spark-worker-2

  # HiveServer2-compatible endpoint (Spark Thrift Server) over the shared Hive metastore.
  spark-thrift:
    <<: *spark
    hostname: spark-thrift
    command: >
      /opt/spark/bin/spark-submit --master local[4] --driver-memory 1g
      --name GeoPulse-HiveServer2
      --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2 spark-internal
    ports: ["10000:10000", "4041:4040"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Speed layer: Spark Structured Streaming job consuming Kafka (started with `make stream`).
  streamer:
    <<: *spark
    hostname: streamer
    profiles: ["stream"]
    command: >
      submit --name GeoPulse-Streaming --conf spark.cores.max=2 --driver-memory 1g
      /opt/geopulse/app/streaming/stream_checkins.py
    ports: ["4042:4040"]
    restart: on-failure
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      spark-master: { condition: service_started }

  # ---------------- Apps ----------------
  producer:
    <<: *app
    profiles: ["replay"]
    command: python -m producer.replay_producer
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - PG_DSN=postgresql://geopulse:geopulse@postgres:5432/geopulse
      - DATA_DIR=/data
      - PYTHONPATH=/app
      - REPLAY_DATASETS=${REPLAY_DATASETS:-nyc,tky}
      - REPLAY_SPEED=${REPLAY_SPEED:-1800}
      - REPLAY_START=${REPLAY_START:-}
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  dashboard:
    <<: *app
    command: streamlit run dashboard/Home.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports: ["8501:8501"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
